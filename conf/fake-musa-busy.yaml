      total: 17179869184    # 16 GiB
      free:  536870912      # 15.5 GiB used
    pci: {bus_id: "0000:00:13.0", bus: 1, device_id: 3, domain_id: 0, sub_system_id: 0}
    numa: {node: 1, cpu_affinity: "8-15"}
    mtlink: {version: "1.0", capacity: 1, bandwidth: 16, peer_gpu_uuids: []}
